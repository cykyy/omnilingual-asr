# Fine-tuning config for omniASR_CTC_300M_v2 on RegSpeech12 dataset
# Optimized for 4x RTX 3090 (24GB each, 96GB total)
# START OF CONFIG

# ============================================================================
# MODEL
# ============================================================================
model:
  name: "omniASR_CTC_300M_v2"
  family: "wav2vec2_asr"

# ============================================================================
# DATASET - RegSpeech12 (80hr train / 10hr valid)
# ============================================================================
dataset:
  name: "regspeech12"
  storage_mode: "MANIFEST"
  train_split: "train"
  valid_split: "valid"

  manifest_storage_config:
    read_text: true

  asr_task_config:
    min_audio_len: 16_000        # 1 second minimum
    max_audio_len: 480_000       # 30 seconds maximum
    max_num_elements: 2_500_000  # 2.5M per GPU (24GB fits comfortably)
    normalize_audio: true
    example_shuffle_window: 1000

# ============================================================================
# TOKENIZER
# ============================================================================
tokenizer:
  name: "omniASR_tokenizer_written_v2"

# ============================================================================
# OPTIMIZER
# ============================================================================
optimizer:
  name: "adamw"
  config:
    lr: 5e-05                    # Same LR (effective batch similar)
    betas: [0.9, 0.98]
    eps: 1e-08
    weight_decay: 0.01

# ============================================================================
# TRAINER - Optimized for 4 GPUs
# ============================================================================
trainer:
  freeze_encoder_for_n_steps: 0
  grad_accumulation:
    num_batches: 1               # No accumulation needed with 4 GPUs!
  mixed_precision:
    dtype: "bfloat16"

# ============================================================================
# REGIME - Faster training with 4 GPUs
# With 4x batch throughput, can reduce steps or keep same for more epochs
# ============================================================================
regime:
  num_steps: 10_000              # Same steps = more epochs = better convergence
  score_metric: "wer"
  publish_metrics_every_n_steps: 100
  validate_after_n_steps: 500
  validate_every_n_steps: 1000
  checkpoint_every_n_steps: 2000

gang: {}
common: {}

# END OF CONFIG
#
# Run with:
#   torchrun --nproc_per_node=4 \
#       -m workflows.recipes.wav2vec2.asr \
#       --config-file workflows/recipes/wav2vec2/asr/configs/regspeech12-4gpu.yaml \
#       output/
